<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page Not Found - STACKLY Medical Devices. The requested page could not be located.">
    <title>404 - Page Not Found | STACKLY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="error-page">
        <!-- Giant background watermark -->
        <div class="error-bg-graphic">404</div>

        <div class="error-container">
            <!-- Animated custom SVG warning/pulse icon -->
            <div class="error-icon">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 8V13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 16.01L12.01 15.999" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <h1 class="error-title">PAGE <span>NOT FOUND</span></h1>
            <p class="error-message">Error Code: 404</p>
            <p class="error-description">
                The medical equipment index page or clinical document you are attempting to retrieve is currently unavailable or has been relocated within our system.
            </p>

            <div class="error-actions">
                <button id="backBtn" class="error-btn-secondary">Go Back</button>
                <a href="index.html" class="error-btn-primary">Go to Home</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
